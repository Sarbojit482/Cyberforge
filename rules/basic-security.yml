rules:
  - id: python-os-system-command-injection
    languages: [python]
    severity: ERROR
    message: >
      Untrusted input passed to os.system()/os.popen() can allow arbitrary
      command execution. Use subprocess with a fixed argument list (never
      shell=True) and never build the command from string concatenation
      or f-strings/.format() on external input.
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)

  - id: python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >
      subprocess call with shell=True is dangerous when any part of the
      command includes external input — it enables shell metacharacter
      injection. Pass a list of arguments and omit shell=True.
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)

  - id: python-eval-use
    languages: [python]
    severity: ERROR
    message: >
      Use of eval() on any value that could be influenced by external
      input allows arbitrary code execution. Avoid eval() entirely, or use
      ast.literal_eval() for parsing trusted literal data only.
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
    pattern: eval(...)

  - id: python-hardcoded-secret
    languages: [python]
    severity: WARNING
    message: >
      Hardcoded credential/secret literal detected. Load secrets from
      environment variables or a secrets manager instead of committing
      them to source.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|secret|api_key|apikey|token)

  - id: python-yaml-load-unsafe
    languages: [python]
    severity: ERROR
    message: >
      yaml.load() without an explicit safe Loader can execute arbitrary
      Python objects embedded in the YAML input. Use yaml.safe_load()
      instead.
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
    pattern: yaml.load($DATA)
